# SDK Method to OpenAPI Endpoint Mappings
signatures:
  - pattern: "stripe.Charge.create"
    endpoint: "/v1/charges"
    method: "POST"
  - pattern: "stripe.Charge.retrieve"
    endpoint: "/v1/charges/{id}"
    method: "GET"
  - pattern: "stripe.Charge.modify"
    endpoint: "/v1/charges/{id}"
    method: "POST"
  - pattern: "stripe.PaymentIntent.create"
    endpoint: "/v1/payment_intents"
    method: "POST"
  - pattern: "stripe.PaymentIntent.retrieve"
    endpoint: "/v1/payment_intents/{intent}"
    method: "GET"
  - pattern: "stripe.Customer.create"
    endpoint: "/v1/customers"
    method: "POST"
  - pattern: "stripe.Customer.retrieve"
    endpoint: "/v1/customers/{customer}"
    method: "GET"
  - pattern: "stripe.Refund.create"
    endpoint: "/v1/refunds"
    method: "POST"
  - pattern: "openai.chat.completions.create"
    endpoint: "/v1/chat/completions"
    method: "POST"
  - pattern: "openai.embeddings.create"
    endpoint: "/v1/embeddings"
    method: "POST"
  - pattern: "github.get_user"
    endpoint: "/user"
    method: "GET"
  - pattern: "github.get_repo"
    endpoint: "/repos/{owner}/{repo}"
    method: "GET"
